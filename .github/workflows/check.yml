name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 检查写作规范
        run: node scripts/check.mjs SKILL.md reference.md DEVELOPMENT.md README.md NOTICE.md
