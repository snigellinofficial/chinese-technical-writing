<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 192" width="852" height="192" role="img" aria-label="让我们讲中文！LET US SPEAK CHINESE">
  <title>让我们讲中文！LET US SPEAK CHINESE</title>
  <desc>字形取自像素字体 Zpix，该字体以 MIT 许可发布。</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'Zpix Embedded';
        src: url(data:font/ttf;base64,) format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      .cjk { font-family: 'Zpix Embedded', monospace; font-size: 48px; fill: #e8d8a8; }
      .latin { font-family: 'Zpix Embedded', monospace; font-size: 24px; letter-spacing: 12px; fill: #facc15; }
    </style>
  </defs>
  <rect width="852" height="192" fill="#0b1220"/>
  <g fill="#334155" shape-rendering="crispEdges">
    <rect x="32" y="24" width="8" height="24"/>
    <rect x="24" y="32" width="24" height="8"/>
    <rect x="812" y="24" width="8" height="24"/>
    <rect x="804" y="32" width="24" height="8"/>
    <rect x="32" y="144" width="8" height="24"/>
    <rect x="24" y="152" width="24" height="8"/>
    <rect x="812" y="144" width="8" height="24"/>
    <rect x="804" y="152" width="24" height="8"/>
  </g>
  <text class="cjk" x="426" y="84" text-anchor="middle">让我们讲中文！</text>
  <text class="latin" x="426" y="156" text-anchor="middle">LET US SPEAK CHINESE</text>
</svg>
